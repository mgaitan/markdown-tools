[project]
name = "md-to-telegraph"
version = "0.1.10"
description = "Convert Markdown to Telegraph DOM nodes"
readme = "README.md"
authors = [{ name = "Martín Gaitán", email = "gaitan@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["markdown", "telegraph", "dom"]
dependencies = [
    "mistletoe>=1.5.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.urls]
Homepage = "https://github.com/mgaitan/markdown-tools/tree/master/packages/md-to-telegraph"
Repository = "https://github.com/mgaitan/markdown-tools"
Issues = "https://github.com/mgaitan/markdown-tools/issues"

[project.scripts]
md-to-telegraph = "md_to_telegraph.cli:main"

[build-system]
requires = ["uv_build>=0.7,<0.12"]
build-backend = "uv_build"
