<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drafts | Markdown</title>
    <meta name="description" content="Saved Markdown drafts in this browser.">
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/static/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/styles.css?v=21">
  </head>
  <body>
    <main class="page narrow">
      <h1>Drafts</h1>
      <p id="drafts-empty" class="note" hidden>No saved drafts yet.</p>
      <ul id="draft-list" class="draft-list" aria-live="polite"></ul>
    </main>
    <dialog id="rename-draft-dialog" aria-labelledby="rename-draft-dialog-title">
      <form id="rename-draft-form" method="dialog">
        <h2 id="rename-draft-dialog-title">Rename draft</h2>
        <label class="metadata-field">Name<input id="rename-draft-name" name="name" type="text" maxlength="80" autocomplete="off" required></label>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel">Cancel</button>
          <button class="button button-primary" value="save">Save</button>
        </div>
      </form>
    </dialog>
    <footer class="footer">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/drafts/">Drafts</a>
      <a href="/bookmarklets/">Bookmarklets</a>
      <a href="/t/published/">Published</a>
      <a href="/docs">API</a>
      <a href="https://github.com/mgaitan/markdown-tools/tree/master/packages/markdown-web">GitHub</a>
    </footer>
    <script>
      const SAVED_DRAFTS_KEY = "markdown-web-saved-drafts";
      const ACTIVE_SAVED_DRAFT_KEY = "markdown-web-active-saved-draft";
      const draftList = document.querySelector("#draft-list");
      const draftsEmpty = document.querySelector("#drafts-empty");
      const renameDraftDialog = document.querySelector("#rename-draft-dialog");
      const renameDraftForm = document.querySelector("#rename-draft-form");
      const renameDraftName = document.querySelector("#rename-draft-name");
      let renamingDraftId = "";

      function readSavedDrafts() {
        try {
          const drafts = JSON.parse(localStorage.getItem(SAVED_DRAFTS_KEY) || "[]");
          return Array.isArray(drafts) ? drafts.filter((draft) => draft && typeof draft === "object") : [];
        } catch {
          return [];
        }
      }

      function writeSavedDrafts(drafts) {
        try {
          localStorage.setItem(SAVED_DRAFTS_KEY, JSON.stringify(drafts));
          return true;
        } catch {
          return false;
        }
      }

      function formatDraftTime(value) {
        const time = Number(value);
        return Number.isFinite(time) ? new Date(time).toLocaleString() : "Saved locally";
      }

      function openRenameDraftDialog(id) {
        const draft = readSavedDrafts().find((item) => item.id === id);
        if (!draft) return;
        renamingDraftId = id;
        renameDraftName.value = draft.name || "Untitled draft";
        renameDraftDialog.showModal();
        renameDraftName.select();
      }

      function renameSavedDraft(id, name) {
        const normalizedName = name.trim();
        if (!normalizedName) return false;
        const drafts = readSavedDrafts();
        const index = drafts.findIndex((item) => item.id === id);
        if (index < 0) return false;
        drafts[index] = {...drafts[index], name: normalizedName, updated_at: Date.now()};
        if (!writeSavedDrafts(drafts)) return false;
        renderDraftList();
        return true;
      }

      function deleteSavedDraft(id) {
        if (!window.confirm("Delete this draft?")) return;
        const drafts = readSavedDrafts().filter((draft) => draft.id !== id);
        if (!writeSavedDrafts(drafts)) return;
        try {
          if (localStorage.getItem(ACTIVE_SAVED_DRAFT_KEY) === id) {
            localStorage.removeItem(ACTIVE_SAVED_DRAFT_KEY);
          }
        } catch {
          // The draft list can still be updated when this preference cannot be stored.
        }
        renderDraftList();
      }

      function renderDraftList() {
        const drafts = readSavedDrafts().sort((left, right) => Number(right.updated_at) - Number(left.updated_at));
        draftList.replaceChildren();
        draftsEmpty.hidden = Boolean(drafts.length);
        for (const draft of drafts) {
          const item = document.createElement("li");
          item.className = "draft-item";
          const summary = document.createElement("div");
          const open = document.createElement("a");
          open.className = "draft-open";
          open.href = `/?draft=${encodeURIComponent(draft.id)}`;
          open.textContent = draft.name || "Untitled draft";
          open.title = open.textContent;
          const updated = document.createElement("span");
          updated.className = "draft-updated";
          updated.textContent = formatDraftTime(draft.updated_at);
          summary.append(open, updated);
          const rename = document.createElement("button");
          rename.className = "draft-action";
          rename.type = "button";
          rename.setAttribute("aria-label", "Rename draft");
          rename.title = "Rename draft";
          rename.innerHTML = "&#9998;";
          rename.addEventListener("click", () => openRenameDraftDialog(draft.id));
          const remove = document.createElement("button");
          remove.className = "draft-action";
          remove.type = "button";
          remove.setAttribute("aria-label", "Delete draft");
          remove.title = "Delete draft";
          remove.innerHTML = "&#128465;";
          remove.addEventListener("click", () => deleteSavedDraft(draft.id));
          item.append(summary, rename, remove);
          draftList.append(item);
        }
      }

      renderDraftList();
      renameDraftForm.addEventListener("submit", (event) => {
        if (event.submitter?.value !== "save") return;
        event.preventDefault();
        if (!renameSavedDraft(renamingDraftId, renameDraftName.value)) return;
        renamingDraftId = "";
        renameDraftDialog.close();
      });
    </script>
  </body>
</html>
