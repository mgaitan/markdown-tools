<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Write, convert, and publish Markdown</title>
    <meta name="description" content="Write Markdown, convert web pages and documents, and publish to Telegraph.">
    <link rel="canonical" href="{{ site_url }}/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site_url }}/">
    <meta property="og:title" content="Write, convert, and publish Markdown">
    <meta property="og:description" content="Write Markdown, convert web pages and documents, and publish to Telegraph.">
    <meta property="og:site_name" content="Markdown Web">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Write, convert, and publish Markdown">
    <meta name="twitter:description" content="Write Markdown, convert web pages and documents, and publish to Telegraph.">
    <meta property="og:image" content="{{ site_url }}/static/social-card.png?v=2">
    <meta property="og:image:alt" content="M logo for Markdown Web">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:image" content="{{ site_url }}/static/social-card.png?v=2">
    <meta name="twitter:image:alt" content="M logo for Markdown Web">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/static/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="manifest" href="/static/manifest.webmanifest?v=2">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="/static/styles.css?v=20">
  </head>
  <body>
    <main class="page">
      <section class="workspace" aria-labelledby="page-title">
        <h1 id="page-title">Write, convert, and publish Markdown</h1>
        <form id="process-form" class="source-form">
          <div id="source-entry" class="source-entry">
            <div id="drop-zone" class="source-dropzone">
              <label class="sr-only" for="source-url">URL, file, or Markdown</label>
              <input id="source-url" name="url" type="text" placeholder="Paste a URL, drop a file or insert markdown content" autofocus autocomplete="off" spellcheck="false">
              <button id="file-button" class="file-button" type="button" aria-label="Choose a file" title="Choose a file">&#8593;</button>
              <button id="record-button" class="file-button" type="button" aria-label="Record audio" title="Record audio" aria-pressed="false"><img src="/static/microphone.svg" alt=""></button>
              <input id="source-file" class="file-input" type="file" accept=".pdf,.doc,.docx,.epub,.ppt,.pptx,.xls,.xlsx,.odt,.ods,.odp,.rtf,.csv,image/png,image/jpeg,image/webp,audio/*,.flac,.mp3,.mp4,.mpeg,.mpga,.m4a,.ogg,.wav,.webm">
            </div>
            <div class="source-action-field">
              <button id="source-action-button" class="source-action-button button button-primary" type="submit" name="action" value="process">Process</button>
              <button id="source-action-menu-button" class="source-action-menu-button" type="button" aria-label="Choose source action" aria-haspopup="menu" aria-expanded="false"></button>
              <div id="source-action-menu" class="source-action-menu" role="menu" hidden>
                <button type="button" role="menuitem" data-source-action="process">Process</button>
                <button type="button" role="menuitem" data-source-action="publish">Publish</button>
                <button type="button" role="menuitem" data-source-action="epub">Export EPUB</button>
              </div>
            </div>
          </div>

          <section id="result" class="result" hidden>
            <div class="result-toolbar">
              <span id="result-source" class="source-label"></span>
              <div class="result-actions">
                <span id="publish-status" class="status publish-status" role="status" aria-live="polite"></span>
                <button id="new-button" class="button button-secondary" type="button" hidden>New</button>
                <button id="copy-button" class="button button-secondary" type="button">Copy</button>
                <button id="preview-button" class="button button-secondary" type="button">Preview</button>
                <div class="source-action-field result-action-field">
                  <button id="submit-publish" class="source-action-button button button-primary" type="submit">Publish</button>
                  <button id="result-action-menu-button" class="source-action-menu-button" type="button" aria-label="Choose editor action" aria-haspopup="menu" aria-expanded="false"></button>
                  <div id="result-action-menu" class="source-action-menu" role="menu" hidden>
                    <button type="button" role="menuitem" data-result-action="epub">Download EPUB</button>
                    <button type="button" role="menuitem" data-result-action="markdown">Download Markdown</button>
                  </div>
                </div>
              </div>
            </div>
            <label class="sr-only" for="markdown-output">Markdown</label>
            <div class="markdown-editor">
              <div id="markdown-toolbar" class="markdown-toolbar" role="toolbar" aria-label="Markdown formatting">
                <select id="heading-action" aria-label="Heading" title="Heading">
                  <option value="">H</option>
                  <option value="1">H1</option>
                  <option value="2">H2</option>
                  <option value="3">H3</option>
                </select>
                <button type="button" data-markdown-action="bold" aria-label="Bold" title="Bold"><strong>B</strong></button>
                <button type="button" data-markdown-action="italic" aria-label="Italic" title="Italic"><em>I</em></button>
                <button type="button" data-markdown-action="strike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
                <span class="toolbar-divider" aria-hidden="true"></span>
                <button type="button" data-markdown-action="quote" aria-label="Quote" title="Quote">&gt;</button>
                <button type="button" data-markdown-action="unordered-list" aria-label="Bullet list" title="Bullet list">&#8226;</button>
                <button type="button" data-markdown-action="ordered-list" aria-label="Numbered list" title="Numbered list">&#9776;</button>
                <span class="toolbar-divider" aria-hidden="true"></span>
                <button type="button" data-markdown-action="link" aria-label="Link" title="Link">&#8599;</button>
                <button type="button" data-markdown-action="image" aria-label="Upload image" title="Upload image">&#9639;</button>
                <button type="button" data-markdown-action="code" aria-label="Inline code" title="Inline code">&lt;/&gt;</button>
                <button type="button" data-markdown-action="code-block" aria-label="Code block" title="Code block">&#123;&#125;</button>
                <button type="button" data-markdown-action="horizontal-rule" aria-label="Horizontal rule" title="Horizontal rule">&#8212;</button>
                <span class="toolbar-divider" aria-hidden="true"></span>
                <button id="toolbar-record-button" class="file-button toolbar-record-button" type="button" aria-label="Record audio into document" title="Record audio into document" aria-pressed="false"><img src="/static/microphone.svg" alt=""></button>
                <button id="metadata-button" type="button" aria-label="Publication metadata" title="Publication metadata">Meta</button>
                <button id="expand-editor" class="editor-expand-button" type="button" aria-label="Maximize editor" title="Maximize editor">&#x2922;</button>
              </div>
              <textarea id="markdown-output" spellcheck="false"></textarea>
            </div>
            <input id="editor-image-file" class="file-input" type="file" accept="image/png,image/jpeg,image/webp">
            <div id="preview-pane" class="preview-pane" hidden>
              <iframe id="preview-frame" class="preview-frame" title="Telegraph preview" loading="eager" sandbox></iframe>
            </div>
          </section>
          <p id="status" class="status" role="status"></p>
        </form>
      </section>
    </main>

    <dialog id="new-dialog" aria-labelledby="new-dialog-title">
      <form method="dialog">
        <h2 id="new-dialog-title">Start a new document?</h2>
        <p>This will discard the current content.</p>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel">Cancel</button>
          <button id="confirm-new" class="button button-primary" value="confirm">New</button>
        </div>
      </form>
    </dialog>

    <dialog id="metadata-dialog" aria-labelledby="metadata-dialog-title">
      <form id="metadata-form" method="dialog">
        <h2 id="metadata-dialog-title">Publication metadata</h2>
        <div class="metadata-grid">
          <label class="metadata-field">Title<input id="metadata-title" name="title" type="text" autocomplete="off"></label>
          <label class="metadata-field">Author<input id="metadata-author" name="author" type="text" autocomplete="off"></label>
          <label class="metadata-field metadata-wide">Source URL<input id="metadata-url" name="url" type="url" autocomplete="off"></label>
          <label class="metadata-field">Date<input id="metadata-date" name="date" type="date"></label>
          <label class="metadata-field">Type<select id="metadata-type" name="type">
            <option value="">Automatic</option>
            <option value="document">Document</option>
            <option value="article">Article</option>
            <option value="report">Report</option>
            <option value="brief">Brief</option>
            <option value="note">Note</option>
          </select></label>
          <label class="metadata-field metadata-wide">Image URL<input id="metadata-image" name="image" type="url" autocomplete="off"></label>
          <label class="metadata-field metadata-wide">Telegram recipients<input id="metadata-telegram" name="notify_telegram" type="text" placeholder="390225349, -1001234567890" autocomplete="off"></label>
        </div>
        <p class="metadata-note">Separate multiple Telegram recipients with commas.</p>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel">Cancel</button>
          <button id="save-metadata" class="button button-primary" value="save">Apply</button>
        </div>
      </form>
    </dialog>

    <footer class="footer">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/bookmarklets/">Bookmarklets</a>
      <a href="/t/published/">Published</a>
      <a href="/docs">API</a>
      <a href="https://github.com/mgaitan/markdown-tools/tree/master/packages/markdown-web">GitHub</a>
    </footer>

    <aside id="install-prompt" class="install-prompt" aria-label="Install Markdown Web" hidden>
      <span>Install Markdown</span>
      <button id="install-button" class="button button-primary" type="button">Install</button>
      <button id="dismiss-install-prompt" class="install-prompt-close" type="button" aria-label="Dismiss install prompt" title="Dismiss">&times;</button>
    </aside>

    <script>
      const form = document.querySelector("#process-form");
      const sourceEntry = document.querySelector("#source-entry");
      const result = document.querySelector("#result");
      const output = document.querySelector("#markdown-output");
      const markdownEditor = document.querySelector(".markdown-editor");
      const previewPane = document.querySelector("#preview-pane");
      const previewFrame = document.querySelector("#preview-frame");
      const dropZone = document.querySelector("#drop-zone");
      const sourceInput = document.querySelector("#source-url");
      const sourceFile = document.querySelector("#source-file");
      const sourceActionButton = document.querySelector("#source-action-button");
      const sourceActionMenuButton = document.querySelector("#source-action-menu-button");
      const sourceActionMenu = document.querySelector("#source-action-menu");
      const editorImageFile = document.querySelector("#editor-image-file");
      const fileButton = document.querySelector("#file-button");
      const recordButton = document.querySelector("#record-button");
      const toolbarRecordButton = document.querySelector("#toolbar-record-button");
      const sourceLabel = document.querySelector("#result-source");
      const status = document.querySelector("#status");
      const publishStatus = document.querySelector("#publish-status");
      const publishButton = document.querySelector("#submit-publish");
      const previewButton = document.querySelector("#preview-button");
      const resultActionMenuButton = document.querySelector("#result-action-menu-button");
      const resultActionMenu = document.querySelector("#result-action-menu");
      const newButton = document.querySelector("#new-button");
      const newDialog = document.querySelector("#new-dialog");
      const confirmNew = document.querySelector("#confirm-new");
      const metadataButton = document.querySelector("#metadata-button");
      const metadataDialog = document.querySelector("#metadata-dialog");
      const metadataForm = document.querySelector("#metadata-form");
      const expandEditorButton = document.querySelector("#expand-editor");
      const installPrompt = document.querySelector("#install-prompt");
      const installButton = document.querySelector("#install-button");
      const dismissInstallPromptButton = document.querySelector("#dismiss-install-prompt");
      const metadataFields = ["title", "author", "url", "date", "type", "image", "notify_telegram"];
      let currentUrl = "";
      let previewId = "";
      let previewing = false;
      let imageUploading = false;
      let audioRecorder = null;
      let sourceSubmitting = false;
      let epubSubmitting = false;
      let mode = "process";
      let sourceAction = "process";
      const DRAFT_KEY = "markdown-web-draft";
      const SOURCE_ACTION_KEY = "markdown-web-source-action";
      const INSTALL_PROMPT_DISMISS_KEY = "markdown-web-install-prompt-dismissed-at";
      const INSTALL_PROMPT_DISMISS_MS = 7 * 24 * 60 * 60 * 1000;
      const SOURCE_PLACEHOLDER = "Paste a URL, drop a file or insert markdown content";
      const MARKDOWN_START_RE = /(^\s*(?:#{1,6}\s|>\s|[-*+]\s|\d+\.\s|```|~~~|!\[|\[|\*\*|__))/;
      const HTML_SOURCE_RE = /^\s*<(?:!doctype\s+html\b|html\b|article\b|body\b|main\b|section\b|div\b)/i;
      const sharedMarkdown = {{ shared_markdown | tojson }};
      const sharedLabel = {{ shared_label | tojson }};
      const shareError = {{ share_error | tojson }};
      let deferredInstallPrompt = null;
      let markdownCodeMirror = null;

      async function initializeMarkdownEditor() {
        try {
          const [state, view, markdownLanguage, language, commands, autocomplete, search] = await Promise.all([
            import("https://esm.sh/@codemirror/state@6.7.4"),
            import("https://esm.sh/@codemirror/view@6.43.11"),
            import("https://esm.sh/@codemirror/lang-markdown@6.5.2"),
            import("https://esm.sh/@codemirror/language@6.12.4"),
            import("https://esm.sh/@codemirror/commands@6.11.0"),
            import("https://esm.sh/@codemirror/autocomplete@6.20.3"),
            import("https://esm.sh/@codemirror/search@6.7.2"),
          ]);
          const host = document.createElement("div");
          host.className = "markdown-codemirror";
          output.after(host);
          markdownCodeMirror = new view.EditorView({
            state: state.EditorState.create({
              doc: output.value,
              extensions: [
                markdownLanguage.markdown(),
                language.syntaxHighlighting(language.defaultHighlightStyle, {fallback: true}),
                view.EditorView.lineWrapping,
                commands.history(),
                autocomplete.closeBrackets(),
                search.search({top: true}),
                search.highlightSelectionMatches(),
                view.EditorView.updateListener.of((update) => {
                  if (!update.docChanged) return;
                  output.value = update.state.doc.toString();
                  output.dispatchEvent(new Event("input", {bubbles: true}));
                }),
                view.keymap.of([
                  commands.indentWithTab,
                  ...autocomplete.closeBracketsKeymap,
                  ...commands.defaultKeymap,
                  ...commands.historyKeymap,
                  ...search.searchKeymap,
                ]),
              ],
            }),
            parent: host,
          });
          output.hidden = true;
        } catch {
          // Keep the textarea usable when CodeMirror cannot be loaded.
        }
      }

      void initializeMarkdownEditor();

      function isInstalledApp() {
        return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      }

      function isMobileViewport() {
        return window.matchMedia("(max-width: 560px)").matches;
      }

      function installPromptWasDismissed() {
        try {
          return Date.now() - Number(localStorage.getItem(INSTALL_PROMPT_DISMISS_KEY) || 0) < INSTALL_PROMPT_DISMISS_MS;
        } catch {
          return false;
        }
      }

      function hideInstallPrompt(remember = false) {
        installPrompt.hidden = true;
        if (remember) {
          try {
            localStorage.setItem(INSTALL_PROMPT_DISMISS_KEY, String(Date.now()));
          } catch {
            // The prompt remains dismissible when storage is unavailable.
          }
        }
      }

      function setStatus(message, error = false) {
        status.textContent = message;
        status.classList.toggle("error", error);
      }

      function setPublishStatus(message, error = false) {
        publishStatus.textContent = message;
        publishStatus.classList.toggle("error", error);
      }

      function setSourceAction(action) {
        const selected = ["publish", "epub"].includes(action) ? action : "process";
        sourceAction = selected;
        sourceActionButton.value = selected;
        sourceActionButton.textContent = selected === "publish" ? "Publish" : selected === "epub" ? "Export EPUB" : "Process";
        try {
          localStorage.setItem(SOURCE_ACTION_KEY, selected);
        } catch {
          // Preference persistence is best effort when storage is unavailable.
        }
        return selected;
      }

      function restoreSourceAction() {
        let saved = "process";
        try {
          saved = localStorage.getItem(SOURCE_ACTION_KEY) || saved;
        } catch {
          // Use the default when storage is unavailable.
        }
        setSourceAction(saved);
      }

      function closeSourceActionMenu() {
        sourceActionMenu.hidden = true;
        sourceActionMenuButton.setAttribute("aria-expanded", "false");
      }

      function toggleSourceActionMenu() {
        const open = sourceActionMenu.hidden;
        sourceActionMenu.hidden = !open;
        sourceActionMenuButton.setAttribute("aria-expanded", String(open));
      }

      function closeResultActionMenu() {
        resultActionMenu.hidden = true;
        resultActionMenuButton.setAttribute("aria-expanded", "false");
      }

      function toggleResultActionMenu() {
        const open = resultActionMenu.hidden;
        resultActionMenu.hidden = !open;
        resultActionMenuButton.setAttribute("aria-expanded", String(open));
      }

      function setPreviewMode(enabled, url = "") {
        previewing = enabled;
        markdownEditor.hidden = enabled;
        previewPane.hidden = !enabled;
        previewButton.textContent = enabled ? "Back to edit" : "Preview";
        previewButton.setAttribute("aria-pressed", String(enabled));
        if (url) {
          const frameUrl = new URL("/t/preview-frame", window.location.origin);
          frameUrl.searchParams.set("url", url);
          previewFrame.src = frameUrl;
        }
      }

      function markdownValue() {
        return markdownCodeMirror ? markdownCodeMirror.state.doc.toString() : output.value;
      }

      function setMarkdownValue(value) {
        if (markdownCodeMirror) {
          markdownCodeMirror.dispatch({
            changes: {from: 0, to: markdownCodeMirror.state.doc.length, insert: value},
          });
          return;
        }
        output.value = value;
        output.dispatchEvent(new Event("input", {bubbles: true}));
      }

      function markdownSelection() {
        if (!markdownCodeMirror) return {start: output.selectionStart, end: output.selectionEnd};
        return {start: markdownCodeMirror.state.selection.main.from, end: markdownCodeMirror.state.selection.main.to};
      }

      function setMarkdownSelection(start, end) {
        if (markdownCodeMirror) {
          markdownCodeMirror.dispatch({selection: {anchor: start, head: end}});
          markdownCodeMirror.focus();
          return;
        }
        output.setSelectionRange(start, end);
        output.focus();
      }

      function focusMarkdown() {
        if (markdownCodeMirror) markdownCodeMirror.focus();
        else output.focus();
      }

      function updateMarkdown(value, start, end) {
        if (markdownCodeMirror) {
          markdownCodeMirror.dispatch({
            changes: {from: start, to: end, insert: value},
            selection: {anchor: start + value.length},
          });
          markdownCodeMirror.focus();
          return;
        }
        output.setRangeText(value, start, end, "end");
        output.dispatchEvent(new Event("input", {bubbles: true}));
        output.focus();
      }

      function parseFrontmatter(markdown) {
        const match = markdown.match(/^\uFEFF?---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
        if (!match) return {fields: {}, lines: [], body: markdown, hasFrontmatter: false};
        const fields = {};
        const lines = match[1].split(/\r?\n/);
        for (const line of lines) {
          const field = line.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
          if (!field) continue;
          let value = field[2].trim();
          if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.slice(1, -1);
          }
          fields[field[1]] = value;
        }
        return {fields, lines, body: markdown.slice(match[0].length), hasFrontmatter: true};
      }

      function yamlValue(value) {
        return JSON.stringify(value);
      }

      function updateFrontmatter(values) {
        const parsed = parseFrontmatter(markdownValue());
        const lines = [...parsed.lines];
        for (const field of metadataFields) {
          const value = values[field].trim();
          const index = lines.findIndex((line) => line.match(new RegExp(`^${field}:\\s*`)));
          if (index >= 0) {
            if (value) lines[index] = `${field}: ${yamlValue(value)}`;
            else lines.splice(index, 1);
          } else if (value) {
            lines.push(`${field}: ${yamlValue(value)}`);
          }
        }
        const body = parsed.body.replace(/^\r?\n/, "");
        if (!lines.length) {
          setMarkdownValue(body);
        } else {
          setMarkdownValue(`---\n${lines.join("\n")}\n---${body ? `\n${body}` : "\n"}`);
        }
        focusMarkdown();
      }

      function openMetadataDialog() {
        const parsed = parseFrontmatter(markdownValue());
        for (const field of metadataFields) {
          const control = metadataForm.elements[field];
          const value = parsed.fields[field] || "";
          if (field === "type" && value && ![...control.options].some((option) => option.value === value)) {
            control.add(new Option(value, value));
          }
          control.value = value;
        }
        metadataDialog.showModal();
        metadataForm.elements.title.focus();
      }

      function setEditorFullscreen(expanded) {
        document.body.classList.toggle("editor-fullscreen", expanded);
        expandEditorButton.textContent = expanded ? "×" : "⤢";
        expandEditorButton.setAttribute("aria-label", expanded ? "Exit full-screen editor" : "Maximize editor");
        expandEditorButton.title = expanded ? "Exit full-screen editor" : "Maximize editor";
        if (expanded) focusMarkdown();
      }

      function wrapSelection(before, after, placeholder) {
        const {start, end} = markdownSelection();
        const selected = markdownValue().slice(start, end) || placeholder;
        updateMarkdown(before + selected + after, start, end);
        setMarkdownSelection(start + before.length, start + before.length + selected.length);
      }

      function prefixLines(prefix, numbered = false) {
        const {start, end} = markdownSelection();
        const selected = markdownValue().slice(start, end) || "list item";
        const lines = selected.split("\n").map((line, index) => {
          const marker = numbered ? `${index + 1}. ` : prefix;
          return `${marker}${line.replace(/^\s*(?:[-*+] |\d+\. |> )/, "")}`;
        });
        updateMarkdown(lines.join("\n"), start, end);
        setMarkdownSelection(start, start + lines.join("\n").length);
      }

      function applyHeading(level) {
        if (!level) return;
        const {start, end} = markdownSelection();
        const selected = markdownValue().slice(start, end) || "Heading";
        const heading = `${"#".repeat(Number(level))} `;
        const lines = selected.split("\n").map((line) => `${heading}${line.replace(/^\s*#{1,6}\s*/, "")}`);
        const replacement = lines.join("\n");
        updateMarkdown(replacement, start, end);
        setMarkdownSelection(start + heading.length, start + replacement.length);
      }

      function addLink() {
        const url = window.prompt("URL", "https://");
        if (!url) return;
        const {start, end} = markdownSelection();
        const selected = markdownValue().slice(start, end) || "link text";
        const replacement = `[${selected}](${url})`;
        updateMarkdown(replacement, start, end);
        setMarkdownSelection(start + 1, start + 1 + selected.length);
      }

      function addImage() {
        editorImageFile.click();
      }

      function insertImage(url) {
        const {start, end} = markdownSelection();
        const markdown = markdownValue();
        const before = markdown.slice(0, start);
        const after = markdown.slice(end);
        const prefix = before && !before.endsWith("\n") ? "\n\n" : "";
        const suffix = after && !after.startsWith("\n") ? "\n\n" : "";
        updateMarkdown(`${prefix}![](${url})${suffix}`, start, end);
      }

      function insertTranscription(text) {
        const {start, end} = markdownSelection();
        const markdown = markdownValue();
        const before = markdown.slice(0, start);
        const after = markdown.slice(end);
        const prefix = before && !/\n\s*\n$/.test(before) ? "\n\n" : "";
        const suffix = after && !/^\s*\n\s*\n/.test(after) ? "\n\n" : "";
        updateMarkdown(`${prefix}${text}${suffix}`, start, end);
      }

      function isImageFile(file) {
        return Boolean(file) && (
          ["image/png", "image/jpeg", "image/webp"].includes(file.type) ||
          /\.(?:png|jpe?g|webp)$/i.test(file.name)
        );
      }

      function isAudioFile(file) {
        return Boolean(file) && (
          file.type.startsWith("audio/") ||
          /\.(?:flac|mp3|mp4|mpeg|mpga|m4a|ogg|wav|webm)$/i.test(file.name)
        );
      }

      async function transcribeAudio(file, insertAtCursor = false) {
        setPreviewMode(false);
        setStatus("Transcribing audio...");
        try {
          const data = new FormData();
          data.append("file", file);
          const response = await fetch("/transcriptions", {method: "POST", body: data});
          if (!response.ok) throw new Error(await responseError(response, "Audio transcription failed"));
          const result = await response.json();
          if (insertAtCursor) insertTranscription(result.text);
          else showMarkdownEditor(result.text, file.name || "Audio transcription");
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      async function uploadImage(file, insertAtCursor = false, publishAfterUpload = false) {
        if (imageUploading) return;
        imageUploading = true;
        previewButton.disabled = true;
        publishButton.disabled = true;
        setStatus("Uploading image…");
        try {
          const data = new FormData();
          data.append("file", file);
          const response = await fetch("/images", {method: "POST", body: data});
          if (!response.ok) throw new Error(await responseError(response, "Image upload failed"));
          const result = await response.json();
          if (publishAfterUpload) {
            const response = await fetch("/t", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({
                markdown: `![](${result.url})`,
                metadata: {title: file.name || "Image"}
              })
            });
            const data = response.headers.get("content-type")?.includes("application/json")
              ? await response.json()
              : {detail: await response.text()};
            if (!response.ok) throw new Error(data.detail || "Publish failed");
            clearDraft();
            window.location.href = data.url;
          } else if (insertAtCursor) {
            if (previewing) setPreviewMode(false);
            insertImage(result.url);
          } else {
            showMarkdownEditor(`![](${result.url})`, file.name || "Pasted image");
          }
          setStatus("");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          imageUploading = false;
          previewButton.disabled = false;
          publishButton.disabled = false;
        }
      }

      document.querySelector("#markdown-toolbar").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-markdown-action]");
        if (!button) return;
        const action = button.dataset.markdownAction;
        if (action === "bold") wrapSelection("**", "**", "bold text");
        if (action === "italic") wrapSelection("*", "*", "italic text");
        if (action === "strike") wrapSelection("~~", "~~", "strikethrough");
        if (action === "quote") prefixLines("> ");
        if (action === "unordered-list") prefixLines("- ");
        if (action === "ordered-list") prefixLines("", true);
        if (action === "link") addLink();
        if (action === "image") addImage();
        if (action === "code") wrapSelection("`", "`", "code");
        if (action === "code-block") wrapSelection("```\n", "\n```", "code");
        if (action === "horizontal-rule") {
          const {start, end} = markdownSelection();
          updateMarkdown("\n\n---\n\n", start, end);
        }
      });

      document.querySelector("#heading-action").addEventListener("change", (event) => {
        applyHeading(event.target.value);
        event.target.value = "";
      });

      metadataButton.addEventListener("click", openMetadataDialog);
      metadataForm.addEventListener("submit", (event) => {
        if (event.submitter?.value !== "save") return;
        event.preventDefault();
        const values = Object.fromEntries(metadataFields.map((field) => [field, metadataForm.elements[field].value]));
        updateFrontmatter(values);
        currentUrl = values.url.trim();
        metadataDialog.close();
      });

      expandEditorButton.addEventListener("click", () => {
        setEditorFullscreen(!document.body.classList.contains("editor-fullscreen"));
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && document.body.classList.contains("editor-fullscreen") && !metadataDialog.open) {
          setEditorFullscreen(false);
        }
      });

      function saveDraft() {
        const draft = mode === "publish"
          ? {mode, markdown: markdownValue(), url: currentUrl, label: sourceLabel.textContent, preview_id: previewId}
          : {mode, value: sourceInput.value};
        try {
          localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
        } catch {
          // Draft persistence is best effort when storage is unavailable.
        }
      }

      function clearDraft() {
        try {
          localStorage.removeItem(DRAFT_KEY);
        } catch {
          // Draft persistence is best effort when storage is unavailable.
        }
      }

      function restoreDraft() {
        let draft;
        try {
          draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
        } catch {
          return;
        }
        if (!draft || typeof draft !== "object") return;
        if (draft.mode === "publish" && typeof draft.markdown === "string" && draft.markdown) {
          currentUrl = typeof draft.url === "string" ? draft.url : "";
          previewId = typeof draft.preview_id === "string" ? draft.preview_id : "";
          mode = "publish";
          setMarkdownValue(draft.markdown);
          sourceLabel.textContent = typeof draft.label === "string" && draft.label
            ? draft.label
            : currentUrl || "Markdown";
          sourceEntry.hidden = true;
          result.hidden = false;
          newButton.hidden = false;
          setPublishStatus("");
          return;
        }
        if (draft.mode === "process" && typeof draft.value === "string" && draft.value) {
          sourceInput.value = draft.value;
          sourceInput.focus();
        }
      }

      async function responseError(response, fallback) {
        if (response.headers.get("content-type")?.includes("application/json")) {
          const data = await response.json();
          return data.detail || fallback;
        }
        return (await response.text()) || fallback;
      }

      function setSelectedFile(file) {
        const transfer = new DataTransfer();
        transfer.items.add(file);
        sourceFile.files = transfer.files;
        sourceInput.value = "";
        currentUrl = "";
        sourceInput.placeholder = file.name;
        dropZone.classList.add("has-file");
        saveDraft();
      }

      function clearSelectedFile() {
        sourceFile.value = "";
        sourceInput.placeholder = SOURCE_PLACEHOLDER;
        dropZone.classList.remove("has-file");
      }

      function isHttpUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === "http:" || url.protocol === "https:";
        } catch {
          return false;
        }
      }

      function isUrlPrefix(value) {
        const lower = value.toLowerCase();
        return ["http://", "https://"].some((prefix) => prefix.startsWith(lower) || lower.startsWith(prefix));
      }

      function isHtmlDocument(value) {
        return HTML_SOURCE_RE.test(value);
      }

      function showMarkdownEditor(markdown, label = "Markdown") {
        setPreviewMode(false);
        currentUrl = "";
        previewId = "";
        setMarkdownValue(markdown);
        sourceLabel.textContent = label;
        sourceEntry.hidden = true;
        result.hidden = false;
        newButton.hidden = false;
        setPublishStatus("");
        mode = "publish";
        setStatus("");
        saveDraft();
        focusMarkdown();
      }

      async function processSource(url, file, html = "") {
        if (!url && !file && !html) {
          setStatus("Paste a URL, choose a document, or insert Markdown", true);
          sourceInput.focus();
          return false;
        }
        if ([url, file, html].filter(Boolean).length > 1) {
          setStatus("Choose one source at a time", true);
          return false;
        }
        if (file && isImageFile(file)) {
          await uploadImage(file);
          return false;
        }
        if (file && isAudioFile(file)) {
          await transcribeAudio(file);
          return false;
        }
        if (file) currentUrl = "";
        setPreviewMode(false);
        setStatus("Processing…");
        try {
          let response;
          if (file) {
            const data = new FormData();
            data.append("file", file);
            response = await fetch("/md", {method: "POST", body: data});
          } else if (html) {
            response = await fetch("/md", {
              method: "POST",
              headers: {"Content-Type": "text/html"},
              body: html,
            });
          } else {
            response = await fetch("/md/" + encodeURIComponent(url));
          }
          if (!response.ok) throw new Error(await responseError(response, "Processing failed"));
          setMarkdownValue(await response.text());
          previewId = "";
          sourceLabel.textContent = html ? "Pasted HTML" : url || file.name;
          sourceEntry.hidden = true;
          result.hidden = false;
          newButton.hidden = false;
          setPublishStatus("");
          mode = "publish";
          setStatus("");
          saveDraft();
          return true;
        } catch (error) {
          setStatus(error.message, true);
          return false;
        }
      }

      async function downloadEpub() {
        if (epubSubmitting) return false;
        epubSubmitting = true;
        publishButton.disabled = true;
        previewButton.disabled = true;
        resultActionMenuButton.disabled = true;
        setPublishStatus("Building EPUB…");
        try {
          const payload = {markdown: markdownValue()};
          if (currentUrl) payload.metadata = {url: currentUrl};
          const response = await fetch("/epub", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(await responseError(response, "EPUB export failed"));
          const blob = await response.blob();
          const target = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = target;
          link.download = response.headers.get("content-disposition")?.match(/filename="?([^";]+)"?/)?.[1] || "book.epub";
          link.click();
          URL.revokeObjectURL(target);
          setPublishStatus("EPUB ready");
          return true;
        } catch (error) {
          setPublishStatus(error.message, true);
          return false;
        } finally {
          epubSubmitting = false;
          publishButton.disabled = false;
          previewButton.disabled = false;
          resultActionMenuButton.disabled = false;
        }
      }

      function downloadMarkdown() {
        const markdown = markdownValue();
        const title = parseFrontmatter(markdown).fields.title || sourceLabel.textContent || "document";
        const filename = title.trim().replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "") || "document";
        const target = URL.createObjectURL(new Blob([markdown], {type: "text/markdown;charset=utf-8"}));
        const link = document.createElement("a");
        link.href = target;
        link.download = `${filename}.md`;
        link.click();
        URL.revokeObjectURL(target);
        setPublishStatus("Markdown downloaded");
      }

      async function publishSource(url, file) {
        if (sourceSubmitting) return;
        if (!url && !file) {
          setStatus("Paste a URL or choose a document", true);
          sourceInput.focus();
          return;
        }
        if (url && file) {
          setStatus("Choose a URL or a document, not both", true);
          return;
        }
        sourceSubmitting = true;
        sourceActionButton.disabled = true;
        sourceActionMenuButton.disabled = true;
        setStatus("Publishing…");
        try {
          if (file && isImageFile(file)) {
            await uploadImage(file, false, true);
            return;
          }
          if (file && isAudioFile(file)) {
            await transcribeAudio(file);
            return;
          }
          let response;
          if (file) {
            const data = new FormData();
            data.append("file", file);
            response = await fetch("/t", {method: "POST", body: data});
          } else {
            response = await fetch("/t", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({url})
            });
          }
          const data = response.headers.get("content-type")?.includes("application/json")
            ? await response.json()
            : {detail: await response.text()};
          if (!response.ok) throw new Error(data.detail || "Publish failed");
          clearDraft();
          window.location.href = data.url;
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          sourceSubmitting = false;
          sourceActionButton.disabled = false;
          sourceActionMenuButton.disabled = false;
        }
      }

      async function submitSource(url, file) {
        if (sourceAction === "publish") await publishSource(url, file);
        else if (sourceAction === "epub") {
          if (await processSource(url, file)) await downloadEpub();
        } else await processSource(url, file);
      }

      fileButton.addEventListener("click", () => sourceFile.click());
      async function recordAudio(insertAtCursor = false) {
        if (audioRecorder) {
          if (audioRecorder.state === "recording") audioRecorder.stop();
          return;
        }
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
          setStatus("Audio recording is not supported by this browser", true);
          return;
        }
        const button = insertAtCursor ? toolbarRecordButton : recordButton;
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({audio: true});
          const chunks = [];
          const recorder = new MediaRecorder(stream);
          audioRecorder = recorder;
          recorder.addEventListener("dataavailable", (event) => {
            if (event.data.size) chunks.push(event.data);
          });
          recorder.addEventListener("stop", async () => {
            stream.getTracks().forEach((track) => track.stop());
            button.classList.remove("is-recording");
            button.setAttribute("aria-pressed", "false");
            button.setAttribute("aria-label", insertAtCursor ? "Record audio into document" : "Record audio");
            button.title = insertAtCursor ? "Record audio into document" : "Record audio";
            const type = recorder.mimeType || "audio/webm";
            audioRecorder = null;
            if (chunks.length) await transcribeAudio(new File(chunks, "recording.webm", {type}), insertAtCursor);
          });
          recorder.start();
          button.classList.add("is-recording");
          button.setAttribute("aria-pressed", "true");
          button.setAttribute("aria-label", "Stop recording");
          button.title = "Stop recording";
          setStatus("Recording...");
        } catch (error) {
          stream?.getTracks().forEach((track) => track.stop());
          audioRecorder = null;
          setStatus(error.message || "Microphone access was not granted", true);
        }
      }

      recordButton.addEventListener("click", () => recordAudio());
      toolbarRecordButton.addEventListener("click", () => recordAudio(true));
      sourceFile.addEventListener("change", () => {
        const file = sourceFile.files[0];
        if (file) {
          setSelectedFile(file);
          submitSource("", file);
        }
      });
      editorImageFile.addEventListener("change", () => {
        const file = editorImageFile.files[0];
        editorImageFile.value = "";
        if (file) uploadImage(file, true);
      });
      sourceInput.addEventListener("input", () => {
        const value = sourceInput.value;
        if (!value) {
          clearSelectedFile();
          saveDraft();
          return;
        }
        clearSelectedFile();
        if (isHtmlDocument(value)) {
          processSource("", null, value);
          return;
        }
        if (
          !isHttpUrl(value.trim()) &&
          (MARKDOWN_START_RE.test(value) || (value.trim().length > 1 && !isUrlPrefix(value.trim())))
        ) {
          showMarkdownEditor(value);
          return;
        }
        saveDraft();
      });
      document.addEventListener("paste", (event) => {
        if (event.target.closest?.("dialog")) return;
        const file = [...(event.clipboardData?.items || [])]
          .filter((item) => item.kind === "file")
          .map((item) => item.getAsFile())
          .find(Boolean);
        if (file) {
          event.preventDefault();
          if (isImageFile(file)) {
            uploadImage(file, mode === "publish", mode !== "publish" && sourceAction === "publish");
          } else {
            setSelectedFile(file);
            submitSource("", file);
          }
          return;
        }
        const text = event.clipboardData?.getData("text/plain") || "";
        if (!text || isHttpUrl(text.trim())) return;
        if (event.target === output || event.target === sourceInput || event.target.isContentEditable) return;
        event.preventDefault();
        if (isHtmlDocument(text)) {
          processSource("", null, text);
          return;
        }
        showMarkdownEditor(text, "Pasted Markdown");
      });
      dropZone.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropZone.classList.add("is-dragging");
      });
      dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-dragging"));
      dropZone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropZone.classList.remove("is-dragging");
        const file = event.dataTransfer.files[0];
        if (file) {
          setSelectedFile(file);
          submitSource("", file);
        }
      });
      markdownEditor.addEventListener("dragover", (event) => {
        if (!isImageFile(event.dataTransfer.files[0])) return;
        event.preventDefault();
        markdownEditor.classList.add("is-image-dragging");
      });
      markdownEditor.addEventListener("dragleave", () => markdownEditor.classList.remove("is-image-dragging"));
      markdownEditor.addEventListener("drop", (event) => {
        const file = event.dataTransfer.files[0];
        markdownEditor.classList.remove("is-image-dragging");
        if (!isImageFile(file)) return;
        event.preventDefault();
        event.stopPropagation();
        uploadImage(file, true);
      });

      sourceActionMenuButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleSourceActionMenu();
      });
      sourceActionMenu.querySelectorAll("[data-source-action]").forEach((button) => {
        button.addEventListener("click", () => {
          setSourceAction(button.dataset.sourceAction);
          closeSourceActionMenu();
          sourceActionButton.focus();
        });
      });
      resultActionMenuButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleResultActionMenu();
      });
      resultActionMenu.querySelectorAll("[data-result-action]").forEach((button) => {
        button.addEventListener("click", async () => {
          closeResultActionMenu();
          if (button.dataset.resultAction === "epub") await downloadEpub();
          if (button.dataset.resultAction === "markdown") downloadMarkdown();
        });
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".source-action-field")) closeSourceActionMenu();
        if (!event.target.closest(".result-action-field")) closeResultActionMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeSourceActionMenu();
          closeResultActionMenu();
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (mode === "publish") {
          if (publishButton.disabled) return;
          publishButton.disabled = true;
          previewButton.disabled = true;
          setPublishStatus("Publishing…");
          try {
            const payload = {markdown: markdownValue()};
            if (currentUrl) payload.metadata = {url: currentUrl};
            if (previewId) payload.preview_id = previewId;
            const response = await fetch("/t", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify(payload)
            });
            const data = response.headers.get("content-type")?.includes("application/json")
              ? await response.json()
              : {detail: await response.text()};
            if (!response.ok) throw new Error(data.detail || await responseError(response, "Publish failed"));
            clearDraft();
            window.location.href = data.url;
          } catch (error) {
            setPublishStatus(error.message, true);
          } finally {
            publishButton.disabled = false;
            previewButton.disabled = false;
          }
          return;
        }

        const action = setSourceAction(event.submitter?.value || sourceAction);
        currentUrl = sourceInput.value.trim();
        const file = sourceFile.files[0];
        if (action === "publish") await publishSource(currentUrl, file);
        else await processSource(currentUrl, file);
      });

      document.querySelector("#copy-button").addEventListener("click", async () => {
        await navigator.clipboard.writeText(markdownValue());
        setStatus("Copied");
      });

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        if (isMobileViewport() && !isInstalledApp() && !installPromptWasDismissed()) installPrompt.hidden = false;
      });
      installButton.addEventListener("click", async () => {
        if (!deferredInstallPrompt) return;
        installPrompt.hidden = true;
        await deferredInstallPrompt.prompt();
        deferredInstallPrompt = null;
      });
      dismissInstallPromptButton.addEventListener("click", () => hideInstallPrompt(true));
      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        hideInstallPrompt();
      });

      previewButton.addEventListener("click", async () => {
        if (previewing) {
          setPreviewMode(false);
          setPublishStatus("");
          return;
        }
        if (previewButton.disabled || publishButton.disabled) return;
        previewButton.disabled = true;
        publishButton.disabled = true;
        setPublishStatus("Previewing…");
        try {
          const payload = {markdown: markdownValue()};
          if (currentUrl) payload.metadata = {url: currentUrl};
          if (previewId) payload.preview_id = previewId;
          const response = await fetch("/t/preview", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
          });
          const data = response.headers.get("content-type")?.includes("application/json")
            ? await response.json()
            : {detail: await response.text()};
          if (!response.ok) throw new Error(data.detail || await responseError(response, "Preview failed"));
          previewId = data.preview_id;
          saveDraft();
          setEditorFullscreen(false);
          setPreviewMode(true, data.url);
          setPublishStatus("Preview ready");
        } catch (error) {
          setPublishStatus(error.message, true);
        } finally {
          previewButton.disabled = false;
          publishButton.disabled = false;
        }
      });

      output.addEventListener("input", saveDraft);
      newButton.addEventListener("click", () => newDialog.showModal());
      confirmNew.addEventListener("click", () => {
        clearDraft();
        setPreviewMode(false);
        currentUrl = "";
        previewId = "";
        mode = "process";
        sourceInput.value = "";
        setMarkdownValue("");
        sourceLabel.textContent = "";
        clearSelectedFile();
        result.hidden = true;
        sourceEntry.hidden = false;
        newButton.hidden = true;
        setEditorFullscreen(false);
        setPublishStatus("");
        setStatus("");
        sourceInput.focus();
      });

      restoreSourceAction();
      if (sharedMarkdown) {
        clearDraft();
        showMarkdownEditor(sharedMarkdown, sharedLabel);
        setStatus("Shared content imported");
      } else {
        restoreDraft();
        if (shareError) setStatus(shareError, true);
      }

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js"));
      }

    </script>
  </body>
</html>
